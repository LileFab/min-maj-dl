services:
  back:
    image: minmajdl-back:latest
    container_name: minmaj-dl-backend
    ports:
      - "8001:8000"
    volumes:
      - /srv/samba/music:/music
      - ./data:/data
    environment:
      - DB_PATH=/data/db.sqlite3

  front:
    image: minmajdl-front:latest
    container_name: minmaj-dl-frontend
    ports:
      - "3000:3000"
    depends_on:
      - back
